openapi: 3.1.0
info:
  title: RAG Platform API
  version: 1.0.0
  description: >-
    Tenant-scoped API contract for document ingestion, cited chat, feedback, and
    evaluation. Tenant identity is derived from the validated bearer token and
    server-side membership; no operation accepts a tenant ID as authorization.
servers:
  - url: https://api.example.invalid
    description: Placeholder; deployment-specific base URL is configured later.
security:
  - bearerAuth: []
tags:
  - name: Documents
  - name: Conversations
  - name: Feedback
  - name: Evaluations
  - name: Health
paths:
  /v1/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List documents visible to the authenticated tenant member
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: createdAfter
          in: query
          description: Inclusive RFC 3339 timestamp filter.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Page of authorized documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/documents/upload-intents:
    post:
      tags: [Documents]
      operationId: createUploadIntent
      summary: Create a tenant-authorized document version and constrained upload authorization
      description: >-
        Creates a queued document version and returns a short-lived URL for one
        quarantine object. The client must upload the exact declared content
        size/type and then call the completion operation. Repeating an
        Idempotency-Key with the same canonical payload returns the original
        result; using it with a different payload returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '201':
          description: Upload authorization created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/documents/{documentId}/versions/{versionId}/complete:
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      summary: Verify uploaded object and enqueue an idempotent ingestion job
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '202':
          description: Upload verified and ingestion accepted.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get a document and its current version status
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Authorized document resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Revoke document access and begin asynchronous cleanup
      description: >-
        Access is revoked before the 202 response. Physical cleanup of source,
        metadata, vectors, and cache is asynchronous and auditable. Deletion is
        idempotent; a deleted version cannot be re-indexed.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '202':
          description: Deletion accepted or already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation for the authenticated tenant member
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: List messages in an authorized conversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Page of messages ordered by creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/conversations/{conversationId}/messages/stream:
    post:
      tags: [Conversations]
      operationId: streamChatMessage
      summary: Submit a user message and stream a validated, cited answer
      description: >-
        Uses Server-Sent Events. Before the final validated answer is ready,
        servers may emit progress events but MUST NOT expose draft model tokens.
        A completed event contains only citations validated against authorized
        retrieved chunks. The client must treat a terminal error or disconnect
        before message.completed as an incomplete answer.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
        - name: Last-Event-ID
          in: header
          required: false
          description: Optional event cursor for reconnect where replay is supported.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of progress, validated answer deltas, and a terminal event.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completed:
                  value: |-
                    id: 018f4e74-2f76-7f6a-a411-53e452c10d1c
                    event: message.completed
                    data: {"event_id":"018f4e74-2f76-7f6a-a411-53e452c10d1c","message_id":"c5af2c89-7820-4c28-982a-22f3d71ee63c","content":"The policy renews annually.","citations":[{"document_id":"e37bcfda-f7c1-466b-8c4d-6d3fc4932a48","version_id":"d807338f-b6aa-4ca0-952d-cae1c768485b","chunk_id":"f5ba7b57-9b71-4702-ac7d-bf5ea2b74a2e","page_number":4}],"usage":{"input_tokens":523,"output_tokens":36},"cost_usd":"0.0012"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/messages/{messageId}/feedback:
    post:
      tags: [Feedback]
      operationId: submitFeedback
      summary: Submit or replace feedback for an authorized completed answer
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Feedback accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/evaluations/runs:
    post:
      tags: [Evaluations]
      operationId: createEvaluationRun
      summary: Start an evaluation run for an authorized evaluator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRunRequest'
      responses:
        '202':
          description: Evaluation run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/evaluations/runs/{runId}:
    get:
      tags: [Evaluations]
      operationId: getEvaluationRun
      summary: Get status and aggregate metrics for an authorized evaluation run
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Evaluation run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: Process liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe for required dependencies
      security: []
      responses:
        '200':
          description: Instance is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: One or more required dependencies are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the current tenant, filters, and sort order.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key, scoped to tenant and operation; 8-128 visible ASCII characters.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation value; server validates length/characters or issues one.
      schema:
        type: string
        maxLength: 128
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. Invalid values are ignored and a new trace is started.
      schema:
        type: string
        maxLength: 256
  headers:
    CorrelationId:
      description: Server-issued or validated request correlation identifier.
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request or invalid cursor/filter combination.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated principal lacks tenant membership or required role/resource permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency conflict or incompatible resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Upload declaration exceeds configured limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMedia:
      description: File media type is not supported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request fields fail schema or domain validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate or tenant quota exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: Required dependency is temporarily unavailable; no unsupported success is returned.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error; includes correlation identifier but no sensitive internals.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    DocumentStatus:
      type: string
      enum: [queued, processing, indexed, failed, deleted]
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required: [file_name, media_type, size_bytes]
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        media_type:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    UploadIntentResponse:
      type: object
      additionalProperties: false
      required: [document_id, version_id, upload_url, expires_at, required_headers]
      properties:
        document_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
          pattern: '^https?://'
        expires_at:
          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      required: [object_version_id]
      properties:
        object_version_id:
          type: string
          minLength: 1
          maxLength: 1024
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    IngestionJob:
      type: object
      additionalProperties: false
      required: [job_id, document_id, version_id, status, created_at, updated_at]
      properties:
        job_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentStatus'
        attempt:
          type: integer
          minimum: 1
          default: 1
        failure:
          $ref: '#/components/schemas/FailureSummary'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FailureSummary:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 500
        retryable:
          type: boolean
    Document:
      type: object
      additionalProperties: false
      required: [document_id, file_name, media_type, status, current_version_id, created_at, updated_at]
      properties:
        document_id:
          type: string
          format: uuid
        file_name:
          type: string
          maxLength: 255
        media_type:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        current_version_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        next_cursor:
          type: [string, 'null']
    DeletionAccepted:
      type: object
      additionalProperties: false
      required: [document_id, status, accepted_at]
      properties:
        document_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [deleted]
        accepted_at:
          type: string
          format: date-time
    ConversationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          maxLength: 200
    Conversation:
      type: object
      additionalProperties: false
      required: [conversation_id, title, created_at, updated_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 12000
        document_scope:
          type: array
          description: Optional requested document IDs; every ID is independently authorized.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    MessageRole:
      type: string
      enum: [user, assistant]
    Message:
      type: object
      additionalProperties: false
      required: [message_id, conversation_id, role, content, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
        status:
          type: string
          enum: [completed, insufficient_evidence, failed]
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        created_at:
          type: string
          format: date-time
    MessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: [string, 'null']
    Citation:
      type: object
      additionalProperties: false
      required: [document_id, version_id, chunk_id]
      properties:
        document_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        page_number:
          type: integer
          minimum: 1
        slide_number:
          type: integer
          minimum: 1
        section:
          type: string
          maxLength: 500
        excerpt:
          type: string
          maxLength: 1000
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: string
          enum: [positive, negative]
        note:
          type: [string, 'null']
          maxLength: 2000
    Feedback:
      type: object
      additionalProperties: false
      required: [feedback_id, message_id, rating, created_at]
      properties:
        feedback_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        rating:
          type: string
          enum: [positive, negative]
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    EvaluationRunRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, configuration]
      properties:
        dataset_id:
          type: string
          minLength: 1
          maxLength: 128
        configuration:
          type: object
          additionalProperties: false
          required: [prompt_version, retrieval_version]
          properties:
            prompt_version:
              type: string
              maxLength: 128
            retrieval_version:
              type: string
              maxLength: 128
            model:
              type: string
              maxLength: 128
    EvaluationRun:
      type: object
      additionalProperties: false
      required: [run_id, dataset_id, status, created_at, updated_at]
      properties:
        run_id:
          type: string
          format: uuid
        dataset_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        metrics:
          type: object
          additionalProperties:
            type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [location, code, message]
      properties:
        location:
          type: array
          items:
            type: [string, integer]
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details extended with stable code and correlation_id.
      additionalProperties: true
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable application error code; not a user-facing localized message.
        correlation_id:
          type: string
          maxLength: 128
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
