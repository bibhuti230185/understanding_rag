[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-contracts"
version = "0.1.0"
description = "Transport-neutral contract models for the RAG platform API and workflows."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["python"]

