[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform-api"
version = "0.1.0"
description = "Local Phase 4 vertical-slice API for the RAG platform."
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests/integration", "../../tests/contract"]
pythonpath = ["src", "../../packages/contracts/python"]
